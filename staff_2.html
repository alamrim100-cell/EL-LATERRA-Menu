<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الموظف — إيل لاتيرا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0f0a;--card:#2d1a10;--border:#4a2e1a;
    --gold:#D99B53;--gold-dim:rgba(217,155,83,0.12);
    --cream:#F3E8D8;--dim:#9a7a5a;
    --green:#4caf50;--red:#e53935;--blue:#2980b9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--cream);font-family:'Tajawal',sans-serif;min-height:100vh;padding-bottom:2rem;}

  /* ===== HEADER ===== */
  header{
    background:var(--card);border-bottom:2px solid var(--gold);
    padding:0.9rem 1.2rem;position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
  }
  .h-title{font-size:1.1rem;font-weight:900;color:var(--gold);}
  .h-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.92rem;color:var(--dim);}
  .live-dot{display:flex;align-items:center;gap:5px;font-size:0.78rem;color:var(--green);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.5s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

  /* ===== TABS ===== */
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:19;}
  .tab{
    flex:1;padding:0.75rem 0.5rem;border:none;
    font-family:'Tajawal',sans-serif;font-size:0.82rem;font-weight:700;
    cursor:pointer;transition:all 0.2s;color:var(--dim);
    background:transparent;border-left:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;gap:0.4rem;
  }
  .tab:first-child{border-left:none;}
  .tab.active{color:var(--bg);background:var(--gold);}
  .tab .badge{
    background:var(--red);color:#fff;
    font-size:0.65rem;font-weight:900;
    padding:1px 6px;border-radius:999px;
    display:inline-block;
  }
  .tab.active .badge{background:var(--bg);color:var(--gold);}

  /* ===== STATS BAR ===== */
  .stats{display:flex;gap:0.6rem;padding:0.9rem 1rem;border-bottom:1px solid var(--border);}
  .stat{
    flex:1;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:0.6rem 0.5rem;text-align:center;
  }
  .stat-num{font-size:1.5rem;font-weight:900;color:var(--gold);}
  .stat-ar{font-size:0.7rem;color:var(--dim);}
  .stat-en{font-size:0.82rem;color:var(--border);font-family:'Cormorant Garamond',serif;font-style:italic;}

  /* ===== SECTION PANELS ===== */
  .panel{display:none;padding:1rem;}
  .panel.active{display:block;}

  /* ===== ORDER CARDS ===== */
  .orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.8rem;}

  .order-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;overflow:hidden;
    animation:slideIn 0.35s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .order-card.new-order{border-color:var(--gold);box-shadow:0 0 18px rgba(217,155,83,0.2);}

  .card-head{
    background:var(--gold-dim);padding:0.6rem 0.9rem;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--border);flex-wrap:wrap;gap:0.3rem;
  }
  .table-ar{font-weight:900;font-size:0.95rem;color:var(--gold);}
  .table-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.88rem;color:var(--dim);}
  .card-badges{display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;}
  .badge-new{background:var(--gold);color:var(--bg);font-size:0.62rem;font-weight:900;padding:2px 7px;border-radius:999px;display:flex;flex-direction:column;align-items:center;line-height:1.4;}
  .badge-new span{font-style:italic;font-size:0.55rem;font-weight:400;}
  .badge-type{font-size:0.75rem;font-weight:900;padding:2px 8px;border-radius:999px;color:#fff;}
  .badge-dine{background:#5C3A22;}
  .badge-take{background:var(--blue);}
  .time-ar{font-size:0.72rem;color:var(--dim);}
  .time-en{font-size:0.82rem;color:var(--border);font-family:'Cormorant Garamond',serif;font-style:italic;}

  .card-body{padding:0.7rem 0.9rem;}
  .items-lbl{font-size:0.82rem;color:var(--dim);letter-spacing:0.07em;text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-style:italic;margin-bottom:0.4rem;}
  .order-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(74,46,26,0.4);gap:0.4rem;}
  .order-item:last-child{border-bottom:none;}
  .item-names{flex:1;}
  .item-name-ar{font-size:0.9rem;color:var(--cream);}
  .item-name-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.95rem;color:var(--dim);}
  .item-qty{background:var(--gold);color:var(--bg);font-weight:900;font-size:0.68rem;padding:1px 6px;border-radius:999px;white-space:nowrap;}
  .item-price{font-family:'Cormorant Garamond',serif;font-size:0.78rem;color:var(--dim);direction:ltr;}
  .card-note{margin-top:0.6rem;padding:0.5rem 0.7rem;background:rgba(217,155,83,0.07);border-radius:8px;font-size:0.78rem;color:var(--dim);border-right:3px solid var(--gold);}
  .note-lbl{font-size:0.82rem;color:var(--gold);font-family:'Cormorant Garamond',serif;font-style:italic;display:block;margin-bottom:2px;}

  .card-foot{
    padding:0.6rem 0.9rem;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(0,0,0,0.1);
  }
  .total-lbl{font-size:0.7rem;color:var(--dim);}
  .total-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.82rem;color:var(--border);}
  .total-amt{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1rem;color:var(--gold);direction:ltr;}
  .done-btn{
    background:var(--green);color:#fff;border:none;
    border-radius:8px;padding:5px 12px;
    font-family:'Tajawal',sans-serif;font-weight:900;font-size:0.78rem;
    cursor:pointer;transition:all 0.2s;
  }
  .done-btn:hover{opacity:0.85;transform:scale(1.04);}

  .empty-state{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--dim);}
  .empty-state svg{width:50px;height:50px;stroke:var(--border);margin-bottom:0.8rem;}
  .empty-ar{font-size:1rem;margin-bottom:0.3rem;}
  .empty-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;color:var(--border);}

  /* ===== PRODUCTS PANEL ===== */
  .prod-section-title{
    font-size:0.9rem;font-weight:900;color:var(--gold);
    margin:0.5rem 0 0.7rem;padding-bottom:0.4rem;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:0.4rem;
  }
  .prod-section-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.9rem;color:var(--dim);font-weight:400;}
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem;margin-bottom:1.2rem;}
  .prod-card{
    background:var(--card);border:2px solid var(--border);
    border-radius:12px;padding:0.75rem 0.6rem;
    display:flex;flex-direction:column;align-items:center;
    gap:0.4rem;text-align:center;transition:all 0.2s;
    position:relative;
  }
  .prod-card.unavailable{opacity:0.5;border-color:var(--red);}
  .prod-img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--border);}
  .prod-ar{font-weight:700;font-size:0.82rem;color:var(--cream);}
  .prod-ar.struck{text-decoration:line-through;}
  .prod-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.88rem;color:var(--dim);}
  .prod-price{font-size:0.72rem;color:var(--gold);}
  .prod-status{
    position:absolute;top:5px;left:5px;
    font-size:0.72rem;font-weight:900;
    padding:2px 7px;border-radius:999px;color:#fff;
  }
  .prod-status.av{background:var(--green);}
  .prod-status.un{background:var(--red);}
  .prod-toggle{
    width:100%;padding:0.4rem;border:none;border-radius:7px;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:0.82rem;
    cursor:pointer;transition:all 0.2s;margin-top:2px;
  }
  .prod-toggle.set-un{background:var(--red);color:#fff;}
  .prod-toggle.set-av{background:var(--green);color:#fff;}
  .prod-toggle:hover{opacity:0.85;}

  /* ===== STATS PANEL ===== */
  .stat-section{margin-bottom:1.5rem;}
  .stat-section-title{font-size:0.9rem;font-weight:900;color:var(--gold);margin-bottom:0.7rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border);}
  .top-items{display:flex;flex-direction:column;gap:0.5rem;}
  .top-item{
    display:flex;align-items:center;gap:0.7rem;
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:0.6rem 0.8rem;
  }
  .top-rank{font-size:1.1rem;font-weight:900;color:var(--gold);min-width:28px;text-align:center;}
  .top-name{flex:1;}
  .top-name-ar{font-size:0.88rem;color:var(--cream);}
  .top-name-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.88rem;color:var(--dim);}
  .top-count{font-weight:900;color:var(--gold);font-size:0.88rem;}
  .bar-wrap{height:6px;background:var(--border);border-radius:3px;margin-top:3px;}
  .bar-fill{height:100%;background:var(--gold);border-radius:3px;}

  /* ===== TOAST ===== */
  .toast{
    position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;
    padding:0.6rem 1.2rem;border-radius:10px;
    font-weight:700;font-size:0.85rem;
    opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:99;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div>
    <div class="h-title">☕ لوحة تحكم الموظف</div>
    <div class="h-sub">Staff Dashboard — El Laterra</div>
  </div>
  <div class="live-dot">
    <div class="dot"></div>
    <span>مباشر</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('orders')">
    <div>
      <div>📋 الطلبات</div>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;opacity:0.8;">Orders</div>
    </div>
    <span class="badge" id="newBadge">0</span>
  </button>
  <button class="tab" onclick="switchTab('products')">
    <div>
      <div>⚙️ المنتجات</div>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;opacity:0.8;">Products</div>
    </div>
  </button>
  <button class="tab" onclick="switchTab('stats')">
    <div>
      <div>📊 إحصائيات</div>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;opacity:0.8;">Statistics</div>
    </div>
  </button>
</div>

<!-- STATS BAR -->
<div class="stats">
  <div class="stat">
    <div class="stat-num" id="statNew">0</div>
    <div class="stat-ar">جديدة</div>
    <div class="stat-en">New Orders</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statTotal">0</div>
    <div class="stat-ar">اليوم</div>
    <div class="stat-en">Today Total</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statSales">0</div>
    <div class="stat-ar">ر.ع اليوم</div>
    <div class="stat-en">OMR Today</div>
  </div>
</div>

<!-- ORDERS PANEL -->
<div class="panel active" id="panel-orders">
  <div class="orders-grid" id="ordersGrid">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <p class="empty-ar">في انتظار الطلبات...</p>
      <p class="empty-en">Waiting for orders...</p>
    </div>
  </div>
</div>

<!-- PRODUCTS PANEL -->
<div class="panel" id="panel-products">
  <div id="productsContent"><div style="text-align:center;padding:3rem;color:var(--dim);">⏳ جاري التحميل...</div></div>
</div>

<!-- STATS PANEL -->
<div class="panel" id="panel-stats">
  <div class="stat-section">
    <div class="stat-section-title">
      🏆 أكثر المنتجات طلباً اليوم
      <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.75rem;font-weight:400;color:var(--dim);margin-right:0.4rem;">· Top Items Today</span>
    </div>
    <div class="top-items" id="topItems"><div style="text-align:center;padding:2rem;color:var(--dim);">⏳ جاري التحميل...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA = 'https://fyyxuvqwoykavqhoaowu.supabase.co';
const KEY  = 'sb_publishable_CKq5sKxZvi5k43cmEJ1cjw_Cg7jWk_e';

const MENU = [
  { section:'قهوة الاسبريسو', sectionEn:'Espresso Coffee', items:[
    {id:'اسبريسو',ar:'اسبريسو',en:'Espresso',price:'1.2',img:'Expresso.jpeg'},
    {id:'أمريكانو',ar:'أمريكانو',en:'Americano',price:'1.2',img:'Amricano.jpeg'},
    {id:'كابتشينو',ar:'كابتشينو',en:'Cappuccino',price:'1.6',img:'Cappuccino.jpeg'},
    {id:'لاتيه',ar:'لاتيه',en:'Latte',price:'1.6',img:'lattee22.PNG'},
    {id:'موكا',ar:'موكا',en:'Mocha',price:'2.0',img:'mocha.JPG.png'},
    {id:'فلات وايت',ar:'فلات وايت',en:'Flat White',price:'1.6',img:'Café au Lait.jpeg'},
    {id:'سبانيش',ar:'سبانيش',en:'Spanish',price:'1.9',img:'coldlattee.PNG'},
    {id:'قهوة عربية',ar:'قهوة عربية',en:'Arabic Coffee',price:'2.5',img:'omani.jpeg'},
    {id:'كريمي اسبريسو',ar:'كريمي اسبريسو',en:'Steel Coffee',price:'2.0',img:'creamy.JPG.PNG'},
    {id:'لاتيه مميز',ar:'لاتيه مميز',en:'Special Latte',price:'2.0',img:'Cappuccino.jpeg'},
  ]},
  { section:'القهوة المقطرة', sectionEn:'Drip Coffee', items:[
    {id:'في60 كلاسيك',ar:'في60 كلاسيك',en:'V60 Classic',price:'2.2',img:'v60.jpeg'},
    {id:'في60 فروتي',ar:'في60 فروتي',en:'V60 Fruti',price:'2.5',img:'v60f.jpeg'},
    {id:'كولد برو باشن',ar:'كولد برو باشن',en:'Cold Brew Passion',price:'2.6',img:'passioncoldbrew.jpeg'},
    {id:'كولد برو',ar:'كولد برو',en:'Cold Brew',price:'2.2',img:'coldbrew.JPG.PNG'},
  ]},
  { section:'مشروبات لاتيرا', sectionEn:'Laterra Drinks', items:[
    {id:'فرابتشينو',ar:'فرابتشينو',en:'Frappuccino',price:'2.0',img:'creamy.JPG.PNG'},
    {id:'ماتشا',ar:'ماتشا',en:'Matcha',price:'1.9',img:'matcha.jpeg'},
    {id:'ميلك شيك',ar:'ميلك شيك',en:'Milkshake',price:'1.8',img:'milkshake.jpeg'},
    {id:'آيس تي',ar:'آيس تي',en:'Ice Tea',price:'1.6',img:'icetea.jpeg'},
    {id:'موهيتو',ar:'موهيتو',en:'Mojito',price:'1.8',img:'mojito.jpeg'},
    {id:'بلاك لاتيرا',ar:'بلاك لاتيرا',en:'Black Laterra',price:'1.9',img:'logo.jpeg'},
    {id:'كركديه',ar:'كركديه',en:'Hibiscus',price:'1.5',img:'hibiscus.jpeg'},
    {id:'عصير برتقال',ar:'عصير برتقال',en:'Orange Juice',price:'1.5',img:'orange .jpeg'},
    {id:'هوت شوكليت',ar:'هوت شوكليت',en:'Ice Chocolate',price:'1.5',img:'hotchokle.jpeg'},
  ]},
  { section:'ساندويتش', sectionEn:'Sandwich', items:[
    {id:'كرواسون',ar:'كرواسون',en:'Croissant',price:'0.8',img:'crassiont.jpeg'},
    {id:'مرتديلا',ar:'مرتديلا',en:'Mortadella',price:'1.3',img:'murtadella.jpeg'},
    {id:'حلومي',ar:'حلومي',en:'Halloumi',price:'1.5',img:'hallumi.jpeg'},
  ]},
  { section:'الكيك', sectionEn:'Cake', items:[
    {id:'كريب',ar:'كريب',en:'Crepe',price:'1.9',img:'crip.jpeg'},
    {id:'تيراميسو',ar:'تيراميسو',en:'Tiramisu',price:'2.1',img:'tramisu.jpeg'},
    {id:'تشيزكيك',ar:'تشيزكيك',en:'Cheesecake',price:'2.5',img:''},
    {id:'لندن كيك',ar:'لندن كيك',en:'London Cake',price:'2.5',img:'london.jpeg'},
    {id:'سان سباستيان',ar:'سان سباستيان',en:'San Sebastian',price:'2.5',img:'SanSebastian.jpeg'},
  ]},
];

let allOrders = [];
let unavailableItems = new Set();
let knownIds = new Set();
let activeTab = 'orders';

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['orders','products','stats'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
  if(tab === 'products') renderProducts();
  if(tab === 'stats') renderStats();
}

/* ===== HELPERS ===== */
function timeAgo(d){
  const s = Math.floor((Date.now()-new Date(d))/1000);
  if(s<60) return {ar:`منذ ${s} ث`,en:`${s}s ago`};
  if(s<3600) return {ar:`منذ ${Math.floor(s/60)} د`,en:`${Math.floor(s/60)}m ago`};
  return {ar:`منذ ${Math.floor(s/3600)} س`,en:`${Math.floor(s/3600)}h ago`};
}
function isNew(d){ return (Date.now()-new Date(d))<5*60*1000; }
function isToday(d){ const n=new Date(),t=new Date(d); return n.toDateString()===t.toDateString(); }
function parseItems(s){ try{return JSON.parse(s);}catch{return [{name:s,qty:1,price:0}];} }
function calcTotal(items){ return items.reduce((s,i)=>s+(+(i.price||0))*(+(i.qty||1)),0); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

/* ===== ORDERS ===== */
async function fetchOrders(){
  try{
    const r = await fetch(`${SUPA}/rest/v1/orders?select=*&order=created_at.desc&limit=80`,{
      headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`}
    });
    const data = await r.json();
    if(!Array.isArray(data)) return;

    const newOnes = data.filter(o=>!knownIds.has(o.id));
    if(knownIds.size>0 && newOnes.length>0) toast(`🔔 ${newOnes.length} طلب جديد · New Order!`);
    data.forEach(o=>knownIds.add(o.id));

    allOrders = data;
    updateStats(data);
    renderOrders(data);
  }catch(e){console.error(e);}
}

function updateStats(orders){
  const todayOrders = orders.filter(o=>isToday(o.created_at));
  const newCount = orders.filter(o=>isNew(o.created_at)).length;
  const sales = todayOrders.reduce((s,o)=>s+calcTotal(parseItems(o.items)),0);

  document.getElementById('statNew').textContent = newCount;
  document.getElementById('statTotal').textContent = todayOrders.length;
  document.getElementById('statSales').textContent = sales.toFixed(3);
  document.getElementById('newBadge').textContent = newCount;
}

function renderOrders(orders){
  const grid = document.getElementById('ordersGrid');
  if(orders.length===0){
    grid.innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <p class="empty-ar">في انتظار الطلبات...</p><p class="empty-en">Waiting for orders...</p></div>`;
    return;
  }
  grid.innerHTML = orders.map(o=>{
    const items = parseItems(o.items);
    const t = timeAgo(o.created_at);
    const total = calcTotal(items);
    const isT = o.order_type && o.order_type.includes('Take');
    return `
    <div class="order-card ${isNew(o.created_at)?'new-order':''}" id="card-${o.id}">
      <div class="card-head">
        <div>
          <div class="table-ar">${isT?'🥤':'🪑'} ${isT?'':'طاولة '}${o.table_number}</div>
          <div class="table-en">${isT?'Takeaway':'Table'} ${o.table_number}</div>
        </div>
        <div class="card-badges">
          ${isNew(o.created_at)?`<div class="badge-new">جديد<span>New</span></div>`:''}
          ${o.order_type?`<span class="badge-type ${isT?'badge-take':'badge-dine'}">${isT?'🥤 Takeaway':'🪑 Dine In'}</span>`:''}
          <div>
            <div class="time-ar">${t.ar}</div>
            <div class="time-en">${t.en}</div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="items-lbl">Items · الطلبات</div>
        ${items.map(item=>`
          <div class="order-item">
            <div class="item-names">
              <div class="item-name-ar">${item.name}</div>
              ${item.nameEn?`<div class="item-name-en">${item.nameEn}</div>`:''}
            </div>
            <span class="item-qty">×${item.qty}</span>
            ${item.price?`<span class="item-price">ر.ع ${(+item.price * +item.qty).toFixed(3)}</span>`:''}
          </div>`).join('')}
        ${o.note?`<div class="card-note"><span class="note-lbl">ملاحظة · Note</span>${o.note}</div>`:''}
      </div>
      <div class="card-foot">
        <div>
          <div class="total-lbl">الإجمالي</div>
          <div class="total-en">Total</div>
        </div>
        <div style="display:flex;align-items:center;gap:0.7rem;">
          <span class="total-amt">ر.ع ${total.toFixed(3)}</span>
          <button class="done-btn" onclick="markDone(${o.id})">
            ✅ تم · Done
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function markDone(id){
  const card = document.getElementById(`card-${id}`);
  if(card){ card.style.opacity='0.4'; card.style.pointerEvents='none'; }
  try{
    await fetch(`${SUPA}/rest/v1/orders?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Prefer':'return=minimal'}
    });
    allOrders = allOrders.filter(o=>o.id!==id);
    knownIds.delete(id);
    toast('✅ تم تسليم الطلب · Order Delivered');
    updateStats(allOrders);
    renderOrders(allOrders);
  }catch(e){
    if(card){card.style.opacity='1';card.style.pointerEvents='';}
    toast('❌ خطأ في الحذف · Delete Error');
  }
}

/* ===== PRODUCTS ===== */
async function loadAvailability(){
  try{
    const r = await fetch(`${SUPA}/rest/v1/availability?select=*`,{
      headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`}
    });
    const data = await r.json();
    if(Array.isArray(data))
      unavailableItems = new Set(data.filter(d=>!d.available).map(d=>d.item_id));
  }catch(e){console.error(e);}
}

async function toggleItem(itemId){
  const wasUn = unavailableItems.has(itemId);
  try{
    const check = await fetch(`${SUPA}/rest/v1/availability?item_id=eq.${encodeURIComponent(itemId)}&select=id`,{
      headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`}
    });
    const ex = await check.json();
    if(ex.length>0){
      await fetch(`${SUPA}/rest/v1/availability?item_id=eq.${encodeURIComponent(itemId)}`,{
        method:'PATCH',
        headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({available:wasUn})
      });
    } else {
      await fetch(`${SUPA}/rest/v1/availability`,{
        method:'POST',
        headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({item_id:itemId,available:!wasUn})
      });
    }
    wasUn ? unavailableItems.delete(itemId) : unavailableItems.add(itemId);
    toast(wasUn?'✅ المنتج متوفر الآن · Available':'🚫 المنتج غير متوفر · Unavailable');
    renderProducts();
  }catch(e){ toast('❌ خطأ في الحفظ · Save Error'); }
}

function renderProducts(){
  const c = document.getElementById('productsContent');
  c.innerHTML = MENU.map(sec=>`
    <div class="prod-section-title">${sec.section} <span class="prod-section-en">· ${sec.sectionEn}</span></div>
    <div class="prod-grid">
      ${sec.items.map(item=>{
        const un = unavailableItems.has(item.id);
        return `<div class="prod-card ${un?'unavailable':''}">
          <span class="prod-status ${un?'un':'av'}">${un?'🚫 Unavailable':'✅ Available'}</span>
          ${item.img?`<img class="prod-img" src="${item.img}" alt="${item.ar}" onerror="this.style.display='none'">`:''}
          <div class="prod-ar ${un?'struck':''}">${item.ar}</div>
          <div class="prod-en">${item.en}</div>
          <div class="prod-price">ر.ع ${item.price}</div>
          <button class="prod-toggle ${un?'set-av':'set-un'}" onclick="toggleItem('${item.id}')">
            ${un?'✅ إتاحة · Enable':'🚫 تعطيل · Disable'}
          </button>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

/* ===== STATS ===== */
function renderStats(){
  const todayOrders = allOrders.filter(o=>isToday(o.created_at));
  const counts = {};
  todayOrders.forEach(o=>{
    parseItems(o.items).forEach(item=>{
      const key = item.name||'';
      counts[key] = (counts[key]||0) + (+item.qty||1);
    });
  });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = sorted[0]?.[1]||1;
  const el = document.getElementById('topItems');
  if(sorted.length===0){
    el.innerHTML=`<div style="text-align:center;padding:2rem;color:var(--dim);">
      لا توجد طلبات اليوم بعد
      <br><span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;">No orders today yet</span>
    </div>`;
    return;
  }
  const medals=['🥇','🥈','🥉'];
  el.innerHTML = sorted.map(([name,count],i)=>`
    <div class="top-item">
      <div class="top-rank">${medals[i]||`${i+1}`}</div>
      <div class="top-name">
        <div class="top-name-ar">${name}</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%"></div></div>
      </div>
      <div class="top-count">${count}×</div>
    </div>
  `).join('');
}

/* ===== INIT ===== */
async function init(){
  await loadAvailability();
  await fetchOrders();
}

init();
setInterval(fetchOrders, 5000);
</script>
</body>
</html>
