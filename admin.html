<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات — إيل لاتيرا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0f0a;--card:#2d1a10;--border:#4a2e1a;
    --gold:#D99B53;--cream:#F3E8D8;--dim:#9a7a5a;
    --green:#4caf50;--red:#e53935;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--cream);font-family:'Tajawal',sans-serif;min-height:100vh;}

  header{
    background:var(--card);border-bottom:2px solid var(--gold);
    padding:1rem 1.5rem;position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
  }
  .header-title h1{font-size:1.2rem;font-weight:900;color:var(--gold);}
  .header-title span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:var(--dim);}

  .links{display:flex;gap:0.8rem;}
  .link-btn{background:var(--border);color:var(--cream);border:none;border-radius:8px;padding:0.45rem 0.9rem;font-family:'Tajawal',sans-serif;font-size:0.8rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:0.4rem;}
  .link-btn:hover{background:var(--gold);color:var(--bg);}

  .section{padding:1.5rem;max-width:900px;margin:0 auto;}
  .section-title{font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.5rem;}
  .section-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:var(--dim);font-weight:400;}

  .products-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:0.8rem;margin-bottom:2rem;}

  .product-card{
    background:var(--card);border:2px solid var(--border);
    border-radius:14px;padding:1rem;
    display:flex;flex-direction:column;align-items:center;
    gap:0.6rem;text-align:center;
    transition:all 0.2s;cursor:pointer;
    position:relative;
  }
  .product-card:hover{border-color:var(--gold);}
  .product-card.unavailable{opacity:0.5;border-color:var(--red);}
  .product-card.unavailable .product-ar{text-decoration:line-through;}

  .product-img{
    width:60px;height:60px;border-radius:50%;
    object-fit:cover;border:2px solid var(--border);
    background:var(--border);
  }
  .product-ar{font-weight:700;font-size:0.95rem;color:var(--cream);}
  .product-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.78rem;color:var(--dim);}
  .product-price{font-size:0.8rem;color:var(--gold);}

  .status-badge{
    position:absolute;top:0.5rem;left:0.5rem;
    font-size:0.65rem;font-weight:900;
    padding:0.2rem 0.5rem;border-radius:999px;
  }
  .status-badge.available{background:var(--green);color:#fff;}
  .status-badge.unavailable{background:var(--red);color:#fff;}

  .toggle-btn{
    width:100%;padding:0.45rem;border:none;border-radius:8px;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:0.8rem;
    cursor:pointer;transition:all 0.2s;margin-top:0.2rem;
  }
  .toggle-btn.set-unavailable{background:var(--red);color:#fff;}
  .toggle-btn.set-available{background:var(--green);color:#fff;}
  .toggle-btn:hover{opacity:0.85;}

  .loading{text-align:center;padding:3rem;color:var(--dim);}
  .save-toast{
    position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;
    padding:0.8rem 1.5rem;border-radius:12px;
    font-weight:700;font-size:0.9rem;
    opacity:0;transition:opacity 0.3s;
    pointer-events:none;z-index:99;
  }
  .save-toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>⚙️ إدارة المنتجات — إيل لاتيرا</h1>
    <span>Product Availability Manager</span>
  </div>
  <div class="links">
    <a href="orders.html" class="link-btn">📋 الطلبات</a>
    <a href="index.html" class="link-btn">☕ المينيو</a>
  </div>
</header>

<div class="section" id="mainContent">
  <div class="loading">⏳ جاري التحميل...</div>
</div>

<div class="save-toast" id="toast">✅ تم الحفظ</div>

<script>
const SUPABASE_URL = 'https://fyyxuvqwoykavqhoaowu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CKq5sKxZvi5k43cmEJ1cjw_Cg7jWk_e';

// قائمة المنتجات الكاملة
const MENU = [
  {
    section: 'قهوة الاسبريسو', sectionEn: 'Espresso Coffee',
    items: [
      {id:'اسبريسو', ar:'اسبريسو', en:'Espresso', price:'1.2', img:'Expresso.jpeg'},
      {id:'أمريكانو', ar:'أمريكانو', en:'Americano', price:'1.2', img:'Amricano.jpeg'},
      {id:'كابتشينو', ar:'كابتشينو', en:'Cappuccino', price:'1.6', img:'Cappuccino.jpeg'},
      {id:'لاتيه', ar:'لاتيه', en:'Latte', price:'1.6', img:'lattee22.PNG'},
      {id:'موكا', ar:'موكا', en:'Mocha', price:'2.0', img:'mocha.JPG.png'},
      {id:'فلات وايت', ar:'فلات وايت', en:'Flat White', price:'1.6', img:'Café au Lait.jpeg'},
      {id:'سبانيش', ar:'سبانيش', en:'Spanish', price:'1.9', img:'coldlattee.PNG'},
      {id:'قهوة عربية', ar:'قهوة عربية', en:'Arabic Coffee', price:'2.5', img:'omani.jpeg'},
      {id:'كريمي اسبريسو', ar:'كريمي اسبريسو', en:'Steel Coffee', price:'2.0', img:'creamy.JPG.PNG'},
      {id:'لاتيه مميز', ar:'لاتيه مميز', en:'Special Latte', price:'2.0', img:'Cappuccino.jpeg'},
    ]
  },
  {
    section: 'القهوة المقطرة', sectionEn: 'Drip Coffee',
    items: [
      {id:'في60 كلاسيك', ar:'في60 كلاسيك', en:'V60 Classic', price:'2.2', img:'v60.jpeg'},
      {id:'في60 فروتي', ar:'في60 فروتي', en:'V60 Fruti', price:'2.5', img:'v60f.jpeg'},
      {id:'كولد برو باشن', ar:'كولد برو باشن', en:'Cold Brew Passion', price:'2.6', img:'passioncoldbrew.jpeg'},
      {id:'كولد برو', ar:'كولد برو', en:'Cold Brew', price:'2.2', img:'coldbrew.JPG.PNG'},
    ]
  },
  {
    section: 'مشروبات لاتيرا', sectionEn: 'Laterra Drinks',
    items: [
      {id:'فرابتشينو', ar:'فرابتشينو', en:'Frappuccino', price:'2.0', img:'creamy.JPG.PNG'},
      {id:'ماتشا', ar:'ماتشا', en:'Matcha', price:'1.9', img:'matcha.jpeg'},
      {id:'ميلك شيك', ar:'ميلك شيك', en:'Milkshake', price:'1.8', img:'milkshake.jpeg'},
      {id:'آيس تي', ar:'آيس تي', en:'Ice Tea', price:'1.6', img:'icetea.jpeg'},
      {id:'موهيتو', ar:'موهيتو', en:'Mojito', price:'1.8', img:'mojito.jpeg'},
      {id:'بلاك لاتيرا', ar:'بلاك لاتيرا', en:'Black Laterra', price:'1.9', img:'logo.jpeg'},
      {id:'كركديه', ar:'كركديه', en:'Hibiscus', price:'1.5', img:'hibiscus.jpeg'},
      {id:'عصير برتقال', ar:'عصير برتقال', en:'Orange Juice', price:'1.5', img:'orange .jpeg'},
      {id:'هوت شوكليت', ar:'هوت شوكليت', en:'Ice Chocolate', price:'1.5', img:'hotchokle.jpeg'},

  },
  {
    section: 'ساندويتش', sectionEn: 'Sandwich',
    items: [
      {id:'كرواسون', ar:'كرواسون', en:'Croissant', price:'0.8', img:'crassiont.jpeg'},
      {id:'مرتديلا', ar:'مرتديلا', en:'Mortadella', price:'1.3', img:'murtadella.jpeg'},
      {id:'حلومي', ar:'حلومي', en:'Halloumi', price:'1.5', img:'hallumi.jpeg'},
    ]
  },
  {
    section: 'الكيك', sectionEn: 'Cake',
    items: [
      {id:'كريب', ar:'كريب', en:'Crepe', price:'1.9', img:'crip.jpeg'},
      {id:'تيراميسو', ar:'تيراميسو', en:'Tiramisu', price:'2.1', img:'tramisu.jpeg'},
      {id:'تشيزكيك', ar:'تشيزكيك', en:'Cheesecake', price:'2.5', img:''},
      {id:'لندن كيك', ar:'لندن كيك', en:'London Cake', price:'2.5', img:'london.jpeg'},
      {id:'سان سباستيان', ar:'سان سباستيان', en:'San Sebastian', price:'2.5', img:'SanSebastian.jpeg'},
    ]
  }
];

let unavailableItems = new Set();

async function loadAvailability(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/availability?select=*`, {
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    const data = await res.json();
    if(Array.isArray(data)){
      unavailableItems = new Set(data.filter(d => !d.available).map(d => d.item_id));
    }
  }catch(e){ console.error(e); }
  renderMenu();
}

async function toggleItem(itemId){
  const isUnavailable = unavailableItems.has(itemId);
  const newStatus = isUnavailable; // لو كان غير متوفر يصبح متوفر والعكس

  try{
    // تحقق هل السجل موجود
    const check = await fetch(`${SUPABASE_URL}/rest/v1/availability?item_id=eq.${encodeURIComponent(itemId)}&select=id`, {
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    const existing = await check.json();

    if(existing.length > 0){
      // تحديث
      await fetch(`${SUPABASE_URL}/rest/v1/availability?item_id=eq.${encodeURIComponent(itemId)}`, {
        method:'PATCH',
        headers:{
          'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,
          'Content-Type':'application/json','Prefer':'return=minimal'
        },
        body: JSON.stringify({available: newStatus})
      });
    } else {
      // إنشاء جديد
      await fetch(`${SUPABASE_URL}/rest/v1/availability`, {
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,
          'Content-Type':'application/json','Prefer':'return=minimal'
        },
        body: JSON.stringify({item_id: itemId, available: newStatus})
      });
    }

    if(isUnavailable){
      unavailableItems.delete(itemId);
    } else {
      unavailableItems.add(itemId);
    }

    showToast(isUnavailable ? '✅ المنتج متوفر الآن' : '🚫 المنتج غير متوفر');
    renderMenu();
  }catch(e){
    console.error(e);
    showToast('❌ خطأ في الحفظ');
  }
}

function renderMenu(){
  const container = document.getElementById('mainContent');
  container.innerHTML = MENU.map(section => `
    <div>
      <div class="section-title">
        ${section.section}
        <span class="section-en">· ${section.sectionEn}</span>
      </div>
      <div class="products-grid">
        ${section.items.map(item => {
          const unavailable = unavailableItems.has(item.id);
          return `
            <div class="product-card ${unavailable ? 'unavailable' : ''}">
              <span class="status-badge ${unavailable ? 'unavailable' : 'available'}">
                ${unavailable ? '🚫 غير متوفر' : '✅ متوفر'}
              </span>
              ${item.img ? `<img class="product-img" src="${item.img}" alt="${item.ar}" onerror="this.style.display='none'">` : ''}
              <div class="product-ar">${item.ar}</div>
              <div class="product-en">${item.en}</div>
              <div class="product-price">ر.ع ${item.price}</div>
              <button class="toggle-btn ${unavailable ? 'set-available' : 'set-unavailable'}"
                onclick="toggleItem('${item.id}')">
                ${unavailable ? '✅ إتاحة المنتج' : '🚫 تعطيل المنتج'}
              </button>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

loadAvailability();
</script>
</body>
</html>
