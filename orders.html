<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة الطلبات — إيل لاتيرا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0f0a;
    --card:#2d1a10;
    --border:#4a2e1a;
    --gold:#D99B53;
    --cream:#F3E8D8;
    --dim:#9a7a5a;
    --green:#4caf50;
    --red:#e53935;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--cream);font-family:'Tajawal',sans-serif;min-height:100vh;}

  header{
    background:var(--card);
    border-bottom:2px solid var(--gold);
    padding:1.2rem 2rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{font-size:1.4rem;font-weight:900;color:var(--gold);}
  .pulse{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.85rem;
    color:var(--green);
  }
  .dot{
    width:10px;height:10px;
    border-radius:50%;
    background:var(--green);
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .stats{
    display:flex;
    gap:1rem;
    padding:1.5rem 2rem;
    border-bottom:1px solid var(--border);
  }
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:0.8rem 1.4rem;
    text-align:center;
  }
  .stat .num{font-size:1.8rem;font-weight:900;color:var(--gold);}
  .stat .lbl{font-size:0.75rem;color:var(--dim);}

  .orders{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:1.2rem;
    padding:1.5rem 2rem;
  }

  .order-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    animation:slideIn 0.4s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  .order-card.new{border-color:var(--gold);box-shadow:0 0 20px rgba(217,155,83,0.25);}

  .card-head{
    background:rgba(217,155,83,0.12);
    padding:0.9rem 1.2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
  }
  .table-num{font-weight:900;font-size:1.1rem;color:var(--gold);}
  .order-time{font-size:0.78rem;color:var(--dim);}

  .card-body{padding:1rem 1.2rem;}
  .order-item{
    display:flex;
    justify-content:space-between;
    padding:0.5rem 0;
    border-bottom:1px solid rgba(74,46,26,0.5);
    font-size:0.95rem;
  }
  .order-item:last-child{border-bottom:none;}
  .item-qty{
    background:var(--gold);
    color:#1a0f0a;
    font-weight:900;
    font-size:0.75rem;
    padding:0.15rem 0.5rem;
    border-radius:999px;
    margin-left:0.5rem;
  }

  .card-note{
    margin-top:0.8rem;
    padding:0.6rem 0.8rem;
    background:rgba(217,155,83,0.08);
    border-radius:8px;
    font-size:0.85rem;
    color:var(--dim);
    border-right:3px solid var(--gold);
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:5rem 2rem;
    color:var(--dim);
  }
  .empty svg{width:60px;height:60px;stroke:var(--border);margin-bottom:1rem;}
  .empty p{font-size:1.1rem;}

  .badge-new{
    background:var(--gold);
    color:#1a0f0a;
    font-size:0.7rem;
    font-weight:900;
    padding:0.2rem 0.6rem;
    border-radius:999px;
  }
</style>
</head>
<body>

<header>
  <h1>☕ شاشة الطلبات — إيل لاتيرا</h1>
  <div style="display:flex;align-items:center;gap:1.5rem;">
    <div class="pulse"><div class="dot"></div><span>مباشر</span></div>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">إجمالي الطلبات</div></div>
  <div class="stat"><div class="num" id="newCount">0</div><div class="lbl">طلبات جديدة</div></div>
</div>

<div class="orders" id="ordersGrid">
  <div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    <p>في انتظار الطلبات...</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fyyxuvqwoykavqhoaowu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CKq5sKxZvi5k43cmEJ1cjw_Cg7jWk_e';

let knownIds = new Set();
let allOrders = [];

function timeAgo(dateStr){
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if(diff < 60) return `منذ ${diff} ث`;
  if(diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  return `منذ ${Math.floor(diff/3600)} س`;
}

function isNew(dateStr){
  return (Date.now() - new Date(dateStr)) < 5 * 60 * 1000;
}

function parseItems(itemsStr){
  try{ return JSON.parse(itemsStr); }
  catch{ return [{name: itemsStr, qty: 1}]; }
}

function render(orders){
  const grid = document.getElementById('ordersGrid');
  document.getElementById('totalCount').textContent = orders.length;
  document.getElementById('newCount').textContent = orders.filter(o=>isNew(o.created_at)).length;

  if(orders.length === 0){
    grid.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>في انتظار الطلبات...</p></div>`;
    return;
  }

  grid.innerHTML = orders.map(order => {
    const items = parseItems(order.items);
    const newOrder = isNew(order.created_at);
    return `
      <div class="order-card ${newOrder ? 'new' : ''}">
        <div class="card-head">
          <div>
            <span class="table-num">🪑 طاولة ${order.table_number}</span>
            ${newOrder ? '<span class="badge-new" style="margin-right:0.5rem">جديد</span>' : ''}
          </div>
          <span class="order-time">${timeAgo(order.created_at)}</span>
        </div>
        <div class="card-body">
          ${items.map(item => `
            <div class="order-item">
              <span>${item.name}</span>
              <span><span class="item-qty">×${item.qty}</span></span>
            </div>
          `).join('')}
          ${order.note ? `<div class="card-note">📝 ${order.note}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function fetchOrders(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc&limit=50`, {
      headers:{
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const data = await res.json();
    if(Array.isArray(data)){
      // صوت عند طلب جديد
      const newOnes = data.filter(o => !knownIds.has(o.id));
      if(knownIds.size > 0 && newOnes.length > 0){
        try{ new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...').play(); }catch(e){}
      }
      data.forEach(o => knownIds.add(o.id));
      allOrders = data;
      render(data);
    }
  }catch(e){ console.error(e); }
}

// تحديث كل 5 ثوانٍ
fetchOrders();
setInterval(fetchOrders, 5000);
</script>
</body>
</html>
