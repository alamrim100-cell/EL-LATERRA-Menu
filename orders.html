<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة الطلبات — إيل لاتيرا | Orders Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0f0a;
    --card:#2d1a10;
    --border:#4a2e1a;
    --gold:#D99B53;
    --cream:#F3E8D8;
    --dim:#9a7a5a;
    --green:#4caf50;
    --red:#e53935;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--cream);font-family:'Tajawal',sans-serif;min-height:100vh;}

  /* HEADER */
  header{
    background:var(--card);
    border-bottom:2px solid var(--gold);
    padding:1rem 2rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
    gap:1rem;
  }
  .header-title{display:flex;flex-direction:column;gap:0.1rem;}
  .header-title h1{font-size:1.3rem;font-weight:900;color:var(--gold);}
  .header-title span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;color:var(--dim);letter-spacing:0.1em;}
  .pulse{display:flex;align-items:center;gap:0.5rem;font-size:0.82rem;color:var(--green);}
  .pulse-sub{font-size:0.7rem;color:var(--dim);}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:blink 1.5s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

  /* STATS */
  .stats{display:flex;gap:1rem;padding:1.2rem 2rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.4rem;text-align:center;min-width:90px;}
  .stat .num{font-size:1.8rem;font-weight:900;color:var(--gold);}
  .stat .lbl-ar{font-size:0.78rem;color:var(--dim);}
  .stat .lbl-en{font-size:0.65rem;color:var(--border);letter-spacing:0.06em;text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-style:italic;}

  /* ORDERS GRID */
  .orders{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:1.2rem;
    padding:1.5rem 2rem;
  }

  .order-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    animation:slideIn 0.4s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  .order-card.new-order{border-color:var(--gold);box-shadow:0 0 20px rgba(217,155,83,0.25);}

  /* CARD HEAD */
  .card-head{
    background:rgba(217,155,83,0.12);
    padding:0.8rem 1.2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:0.4rem;
  }
  .table-info{display:flex;flex-direction:column;gap:0.1rem;}
  .table-ar{font-weight:900;font-size:1rem;color:var(--gold);}
  .table-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.75rem;color:var(--dim);letter-spacing:0.06em;}
  .time-info{display:flex;flex-direction:column;align-items:flex-end;gap:0.1rem;}
  .time-ar{font-size:0.75rem;color:var(--dim);}
  .time-en{font-size:0.65rem;color:var(--border);font-family:'Cormorant Garamond',serif;font-style:italic;}

  /* BADGES */
  .badge-new{background:var(--gold);color:#1a0f0a;font-size:0.65rem;font-weight:900;padding:0.2rem 0.6rem;border-radius:999px;display:flex;flex-direction:column;align-items:center;line-height:1.3;}
  .badge-new span{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:0.6rem;}

  /* CARD BODY */
  .card-body{padding:1rem 1.2rem;}
  .items-label{font-size:0.7rem;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-style:italic;margin-bottom:0.5rem;}
  .order-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0.5rem 0;
    border-bottom:1px solid rgba(74,46,26,0.5);
    font-size:0.95rem;
    gap:0.5rem;
  }
  .order-item:last-child{border-bottom:none;}
  .item-name-ar{flex:1;font-size:1rem;}
  .item-name-en{font-style:italic;font-size:0.88rem;color:var(--dim);margin-top:0.1rem;}
  .item-qty{background:var(--gold);color:#1a0f0a;font-weight:900;font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:999px;white-space:nowrap;}
  .item-price-badge{font-family:'Cormorant Garamond',serif;font-size:0.78rem;color:var(--dim);direction:ltr;}

  .card-note{margin-top:0.8rem;padding:0.6rem 0.8rem;background:rgba(217,155,83,0.08);border-radius:8px;font-size:0.82rem;color:var(--dim);border-right:3px solid var(--gold);}
  .note-label{font-size:0.65rem;color:var(--gold);font-family:'Cormorant Garamond',serif;font-style:italic;display:block;margin-bottom:0.2rem;}

  /* CARD FOOTER */
  .card-foot{
    padding:0.7rem 1.2rem;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.1);
  }
  .total-ar{font-size:0.78rem;color:var(--dim);}
  .total-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.65rem;color:var(--border);}
  .total-amount{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.1rem;color:var(--gold);direction:ltr;}

  /* EMPTY */
  .empty{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--dim);}
  .empty svg{width:60px;height:60px;stroke:var(--border);margin-bottom:1rem;}
  .empty .empty-ar{font-size:1.1rem;margin-bottom:0.3rem;}
  .empty .empty-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.9rem;color:var(--border);}
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>☕ شاشة الطلبات — إيل لاتيرا</h1>
    <span>Orders Screen — El Laterra</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.2rem;">
    <div class="pulse">
      <div class="dot"></div>
      <span>مباشر</span>
    </div>
    <span class="pulse-sub">Live · يتحدث كل 5 ثوانٍ</span>
  </div>
</header>

<div class="stats">
  <div class="stat">
    <div class="num" id="totalCount">0</div>
    <div class="lbl-ar">إجمالي الطلبات</div>
    <div class="lbl-en">Total Orders</div>
  </div>
  <div class="stat">
    <div class="num" id="newCount">0</div>
    <div class="lbl-ar">طلبات جديدة</div>
    <div class="lbl-en">New Orders</div>
  </div>
</div>

<div class="orders" id="ordersGrid">
  <div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    <p class="empty-ar">في انتظار الطلبات...</p>
    <p class="empty-en">Waiting for orders...</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fyyxuvqwoykavqhoaowu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CKq5sKxZvi5k43cmEJ1cjw_Cg7jWk_e';

let knownIds = new Set();

function timeAgo(dateStr){
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if(diff < 60) return {ar:`منذ ${diff} ث`, en:`${diff}s ago`};
  if(diff < 3600) return {ar:`منذ ${Math.floor(diff/60)} د`, en:`${Math.floor(diff/60)}m ago`};
  return {ar:`منذ ${Math.floor(diff/3600)} س`, en:`${Math.floor(diff/3600)}h ago`};
}

function isNew(dateStr){
  return (Date.now() - new Date(dateStr)) < 5 * 60 * 1000;
}

function parseItems(itemsStr){
  try{ return JSON.parse(itemsStr); }
  catch{ return [{name: itemsStr, qty: 1, price: 0}]; }
}

function calcTotal(items){
  return items.reduce((s, i) => s + ((i.price || 0) * (i.qty || 1)), 0);
}

function render(orders){
  const grid = document.getElementById('ordersGrid');
  document.getElementById('totalCount').textContent = orders.length;
  document.getElementById('newCount').textContent = orders.filter(o => isNew(o.created_at)).length;

  if(orders.length === 0){
    grid.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <p class="empty-ar">في انتظار الطلبات...</p>
        <p class="empty-en">Waiting for orders...</p>
      </div>`;
    return;
  }

  grid.innerHTML = orders.map(order => {
    const items = parseItems(order.items);
    const newOrder = isNew(order.created_at);
    const time = timeAgo(order.created_at);
    const total = calcTotal(items);

    return `
      <div class="order-card ${newOrder ? 'new-order' : ''}">
        <div class="card-head">
          <div class="table-info">
            <span class="table-ar">🪑 طاولة ${order.table_number}</span>
            <span class="table-en">Table ${order.table_number}</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.6rem;">
            ${newOrder ? `<div class="badge-new">جديد<span>New</span></div>` : ''}
            <div class="time-info">
              <span class="time-ar">${time.ar}</span>
              <span class="time-en">${time.en}</span>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="items-label">Items · الطلبات</div>
          ${items.map(item => `
            <div class="order-item">
              <div style="flex:1;">
                <div class="item-name-ar">${item.name}</div>
                ${item.nameEn ? `<div class="item-name-en">${item.nameEn}</div>` : ''}
              </div>
              <span class="item-qty">×${item.qty}</span>
              ${item.price ? `<span class="item-price-badge">ر.ع ${(item.price * item.qty).toFixed(3)}</span>` : ''}
            </div>
          `).join('')}
          ${order.note ? `
            <div class="card-note">
              <span class="note-label">ملاحظة · Note</span>
              ${order.note}
            </div>
          ` : ''}
        </div>
        <div class="card-foot">
          <div>
            <div class="total-ar">الإجمالي</div>
            <div class="total-en">Total</div>
          </div>
          <span class="total-amount">ر.ع ${total.toFixed(3)}</span>
        </div>
      </div>
    `;
  }).join('');
}

async function fetchOrders(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc&limit=50`, {
      headers:{
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const data = await res.json();
    if(Array.isArray(data)){
      data.forEach(o => knownIds.add(o.id));
      render(data);
    }
  }catch(e){ console.error(e); }
}

fetchOrders();
setInterval(fetchOrders, 5000);
</script>
</body>
</html>
